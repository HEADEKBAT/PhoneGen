name: checks

# Everything here is runnable locally as `npm run check`. The workflow exists so
# a push cannot quietly skip it — and because two of these checks only fail on
# a case-sensitive filesystem, which most of us are not developing on.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # `npm ci` installs exactly what package-lock.json records and fails if
        # the lockfile has drifted from package.json — the same guarantee
        # --frozen-lockfile gave, from the one manager this project uses.
        run: npm ci

      # ── Fast, dependency-free audits first ──────────────────────────────
      # These need no build and fail in seconds, so a broken registry or a
      # missing translation is reported before the slow steps run.

      - name: Imports resolve
        # Catches an import whose case does not match the file on disk. Windows
        # and macOS do not care; this Linux runner does, and so does the build
        # machine — a mismatch reaches production as "Module not found".
        run: node scripts/check/imports.mjs

      - name: Translations
        # Fails when a key the code uses is missing from en.json, or when a
        # locale has drifted from it. Both render as raw key strings in the UI.
        run: node scripts/i18n/check.mjs

      - name: Sitemap coverage
        # Four ways the sitemap and the app can disagree, all of them failures:
        # a page the sitemap never emits, a URL that answers with a redirect, a
        # page that names another page as its canonical, and a registry slug
        # with no page behind it. The last one was true of 354 URLs.
        run: node scripts/seo/sitemap.check.mjs

      - name: Background removal
        # Pure-logic checks for the segmentation core, including the regression
        # where a global colour threshold punched a hole through a white subject.
        run: node scripts/image-studio/segmentation.check.mjs

      # ── Compiler and linter ─────────────────────────────────────────────

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      # ── Build last: slowest, and the steps above localise most failures ──

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
